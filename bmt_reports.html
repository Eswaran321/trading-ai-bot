<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075985">
<title>BMT REPORTS</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f6f9;color:#172033}
header{background:#075985;color:#fff;text-align:center;padding:18px 10px}
header h1{margin:0;font-size:26px} header p{margin:5px 0 0;font-size:13px}
main{max-width:760px;margin:auto;padding:12px}.box{background:#fff;margin:10px 0;padding:15px;border-radius:12px;box-shadow:0 2px 8px #0002}
h2{font-size:17px;color:#075985;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;font-weight:bold;color:#475569;margin-bottom:4px}
input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;font-size:16px;box-sizing:border-box}
input[readonly]{background:#f1f5f9}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
button{padding:14px;border:0;border-radius:8px;font-weight:bold;font-size:15px}
.copy{background:#16a34a;color:#fff}.whatsapp{background:#25d366;color:#fff}.clear{background:#e2e8f0}
#report{background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:15px;white-space:pre-wrap;line-height:1.7;min-height:240px;font-size:14px;font-family:'Courier New',monospace;user-select:all;cursor:text;color:#172033}
.status{text-align:center;font-size:13px;color:#475569;margin:8px}
@media(max-width:480px){.grid,.buttons{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>BMT REPORTS</h1><p>Clinical Monitoring & Doctor Intimation</p>
  <p  style="font-size:14px;margin-top:8px;"></p></header>
<main>

<div class="box">
<h2>Patient Details</h2>
<div class="grid">
<div><label>Patient Name</label><input id="name"></div>
<div><label>Age</label><input id="Age"></div>
<div><label>Weight</label><input id="Weight" placeholder="Kg"></div>
<div><label>Date</label><input id="date" type="date"></div>
<div><label>Time</label><input id="time" type="time"></div>
</div>
</div>

<div class="box">
<h2>Vital Signs</h2>
<div class="grid">
<div><label>Temperature (°F)</label><input id="temp" type="number" min="1" max="200" step="0.1" placeholder="0 °F"></div>
<div><label>Pulse Rate (beats/min)</label><input id="pulse" type="number" step="0.1" placeholder="0 beats/min"></div>
<div><label>Respiratory Rate (breaths/min)</label><input id="rr" type="number" step="0.1" placeholder="0 breaths/min"></div>
<div><label>BP (mmHg)</label><input id="bp" type="text" placeholder="120/80 mmHg"></div>
<div><label>MAP (mmHg)</label><input id="map" type="number" step="0.1" placeholder="0 mmHg"></div>
<div><label>SpO₂ (%)</label><input id="spo2" type="number" min="0" max="100" step="0.1" placeholder="0 %"></div>
</div>
</div>

<div class="box">
<h2>Fluid Balance</h2>
<div class="grid">
<div><label>IV Fluid Intake (mL)</label><input id="ivf" type="number" step="0.1" placeholder="0 mL"></div>
<div><label>Oral Intake (mL)</label><input id="oral" type="number" step="0.1" placeholder="0 mL"></div>
<div><label>Total Intake (mL)</label><input id="totalin" readonly placeholder="0 mL"></div>
<div><label>Urine + Motion Output (mL)</label><input id="urine" type="number" step="0.1" placeholder="0 mL"></div>
<div><label>Motion (episodes)</label><input id="motion" type="number" placeholder="0 episodes"></div>
<div><label>Vomiting (episodes)</label><input id="vomiting" type="number" placeholder="0 episodes"></div>
<div><label>Total Output (mL)</label><input id="totalout" readonly placeholder="0 mL"></div>
<div><label>Fluid Balance (mL)</label><input id="fluidbalance" readonly placeholder="0 mL"></div>
</div>
</div>

<div class="buttons">
<button class="copy" onclick="copyFields()">Copy</button>
<button class="clear" onclick="clearAll()">Clear</button>
<button class="whatsapp" onclick="whatsapp()">Send to WhatsApp</button>
</div>

<div class="box">
<h2>Final Data (Click Copy or select manually)</h2>
<div id="report">Fill the form and click Copy to see your data here.</div>
<div id="status" class="status"></div>
</div>
</main>

<script>
function E(id){return document.getElementById(id);}
function n(id){return parseFloat(E(id).value)||0;}

function updateCalculations(){
  var totalIn=n("ivf")+n("oral");
  var totalOut=n("urine");
  var balance=totalIn-totalOut;
  E("totalin").value=totalIn;
  E("totalout").value=totalOut;
  E("fluidbalance").value=balance;
}

function formatData(){
  updateCalculations();
  
  var temp=E("temp").value;
  var pulse=E("pulse").value;
  var rr=E("rr").value;
  var bp=E("bp").value;
  var map=E("map").value;
  var spo2=E("spo2").value;
  var ivf=E("ivf").value;
  var oral=E("oral").value;
  var totalin=E("totalin").value;
  var urine=E("urine").value;
  var motion=E("motion").value;
  var vomiting=E("vomiting").value;
  var totalout=E("totalout").value;
  var balance=E("fluidbalance").value;
  
  var lines=[
    E("greeting").textContent,
    "",
    "*Patient Name     : "+(E("name").value||"—")+"*",
    "Date             : "+(E("date").value||"—"),
    "*Temperature      : "+(temp?temp+" °F":"—")+"*",
    "Pulse Rate       : "+(pulse?pulse+" beats/min":""),
    "Respiratory Rate : "+(rr?rr+" breaths/min":""),
    "BP               : "+(bp?bp+" mmHg":""),
    "MAP              : "+(map?map+" mmHg":""),
    "SpO₂             : "+(spo2?spo2+" %":""),
    "IV Fluid Intake  : "+(ivf?ivf+" mL":""),
    "Oral Intake      : "+(oral?oral+" mL":""),
    "*Total Intake     : "+(totalin?totalin+" mL":"—")+"*",
    "Urine+Motion Output : "+(urine?urine+" mL":""),
    "Motion           : "+(motion?motion+" episodes":""),
    "Vomiting         : "+(vomiting?vomiting+" episodes":""),
    "*Total Output     : "+(totalout?totalout+" mL":"—")+"*",
    "*Fluid Balance    : "+(balance?balance+" mL":"—")+"*"
  ];

  return lines.join("\n");
}

async function copyFields(){
  var text=formatData();
  E("report").textContent=text;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      E("status").textContent="✓ Copied successfully!";
    }else{
      var ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.left="-9999px";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok=document.execCommand("copy"); document.body.removeChild(ta);
      E("status").textContent=ok?"✓ Copied successfully!":"Copy failed — please select and copy manually from the data above.";
    }
  }catch(e){
    E("status").textContent="Copy failed-Please Select and copy manually.";
  }
}

function whatsapp(){
  var text=formatData();
  var encoded=encodeURIComponent(text);
  var url="https://wa.me/?text="+encoded;
  window.open(url,"_blank");
  E("status").textContent="Opening WhatsApp...";
}

function clearAll(){
  if(confirm("Clear all entered information?")){
    E("name").value="";
    var d=new Date();
    var yyyy=d.getFullYear(), mm=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
    E("date").value=yyyy+"-"+mm+"-"+dd;
    E("temp").value=""; E("pulse").value=""; E("rr").value="";
    E("bp").value=""; E("map").value=""; E("spo2").value="";
    E("ivf").value=""; E("oral").value=""; E("urine").value="";
    E("motion").value=""; E("vomiting").value="";
    E("totalin").value=""; E("totalout").value=""; E("fluidbalance").value="";
    E("report").textContent="Fill the form and click Copy to see your data here.";
    E("status").textContent="";
    var hour=d.getHours();
    var greeting=hour<12?"Good Morning":"Good Evening";
    E("greeting").textContent=greeting;
  }
}

/* Update Total Intake when IV Fluid or Oral Intake changes */
E("ivf").addEventListener("input", function(){
  updateCalculations();
});

E("oral").addEventListener("input", function(){
  updateCalculations();
});

/* Update Total Output and Fluid Balance when Urine or Motion Output changes */
E("urine").addEventListener("input", function(){
  updateCalculations();
});

function updateFluidBalance(){
  updateCalculations();
}

/* Set current date without UTC conversion */
(function(){
  var d=new Date();
  var yyyy=d.getFullYear(), mm=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  E("date").value=yyyy+"-"+mm+"-"+dd;
  
  /* Set greeting based on current hour */
  var hour=d.getHours();
  var greeting=hour<12?"Good Morning":"Good Evening";
  E("greeting").textContent=greeting;
})();
</script>
</body>
</html>
